[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wamscore"
version = "0.1.0"
description = "Physics-grounded metrics (IVR, E_dn, Delta_act) for visual world-action models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["wamscore"]
