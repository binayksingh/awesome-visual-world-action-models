# One entry per leaderboard CSV. `higher_is_better` drives sorting and the best-value highlight.
navsim_v1:
  title: "NAVSIM v1 (navtest), PDM score"
  sort_by: PDMS
  higher_is_better: true
  metric_cols: [NC, DAC, TTC, EP, PDMS]
nuscenes_planning:
  title: "nuScenes open-loop planning (VAD-style averaged protocol)"
  sort_by: L2_m
  higher_is_better: false
  metric_cols: [L2_m, collision_pct]
occ3d_forecasting:
  title: "Occ3D-nuScenes 4D occupancy forecasting, average over 1-3 s"
  sort_by: mIoU
  higher_is_better: true
  metric_cols: [mIoU, IoU]
nuscenes_generation:
  title: "nuScenes video generation (validation)"
  sort_by: FVD
  higher_is_better: false
  metric_cols: [FID, FVD]
libero:
  title: "LIBERO success rate (%)"
  sort_by: Avg
  higher_is_better: true
  metric_cols: [Spatial, Object, Goal, Long, Avg]
calvin_abc_d:
  title: "CALVIN ABC->D, average tasks completed in a row (out of 5)"
  sort_by: avg_len
  higher_is_better: true
  metric_cols: [avg_len]
